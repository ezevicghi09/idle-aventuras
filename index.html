<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241b2f"><link rel="manifest" href="manifest.json"><title>Idle Aventuras</title><style>
*{box-sizing:border-box}body{margin:0;background:#17131d;color:#fff;font-family:system-ui,sans-serif}header{padding:14px;text-align:center;background:#241b2f;position:sticky;top:0}h1{margin:0;font-size:22px}.stats{padding:10px;background:#211b28;font-size:13px;line-height:1.6}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:7px;background:#111}.nav button,.btn{border:0;border-radius:9px;padding:12px;background:#40314f;color:#fff;font-weight:700}.nav .active{background:#7652a8}.wrap{padding:12px}.card{background:#211b28;border-radius:14px;padding:14px;margin-bottom:10px}.big{text-align:center;font-size:20px}.bar{height:12px;background:#3b3341;border-radius:9px;overflow:hidden}.fill{height:100%;background:#a56be0}.btn{width:100%;margin-top:7px}.small{font-size:13px;color:#cfc7d8}</style></head><body><header><h1>⚔️ Idle Aventuras</h1></header><div id="stats" class="stats"></div><div id="nav" class="nav"></div><main id="app" class="wrap"></main><script>
const foes=[["Rata de cueva",50],["Goblin",120],["Orco",260],["Caballero oscuro",520],["Dragón joven",1000],["Rey de las sombras",2200]];
let s=JSON.parse(localStorage.getItem("idleAventuras")||"null")||{lvl:1,xp:0,gold:0,dmg:10,def:2,hp:120,maxhp:120,enemy:0,ehp:50,kills:0,prestige:0,points:0,mining:1,woodcut:1,fishing:1,farming:1,pet:1,wood:0,ore:0,fish:0,crops:0,essence:0,weapon:"Espada de hierro",rarity:"Común",last:Date.now()};
let tab="Combate";function need(){return 100+s.lvl*55}function emax(){return foes[s.enemy][1]+s.lvl*20}function save(){s.last=Date.now();localStorage.setItem("idleAventuras",JSON.stringify(s))}function off(){let m=Math.min(480,Math.floor((Date.now()-s.last)/60000));if(m>0)s.gold+=m*(5+s.lvl+s.prestige*5);save()}off();
function stats(){document.querySelector("#stats").innerHTML=`Nv.${s.lvl} · XP ${s.xp}/${need()} · 🪙${s.gold} · 💥${s.dmg} · 🛡️${s.def} · ❤️${s.hp}/${s.maxhp}<br>🪵${s.wood} · ⛏️${s.ore} · 🐟${s.fish} · 🌾${s.crops} · ✨${s.essence} · ♻️${s.prestige}`}
function nav(){let a=["Combate","Habilidades","Inventario","Mascotas","Mundo","Prestigio"];document.querySelector("#nav").innerHTML=a.map(x=>`<button class="${tab==x?"active":""}" onclick="go('${x}')">${x}</button>`).join("")}
function go(x){tab=x;render()}function B(x,f){return `<button class="btn" onclick="${f}">${x}</button>`}
function render(){stats();nav();let a=document.querySelector("#app");if(tab=="Combate")combat(a);if(tab=="Habilidades")skills(a);if(tab=="Inventario")inv(a);if(tab=="Mascotas")pets(a);if(tab=="Mundo")world(a);if(tab=="Prestigio")pre(a)}
function combat(a){a.innerHTML=`<section class="card big">👹 ${foes[s.enemy][0]}<div class="bar"><div class="fill" style="width:${Math.max(0,s.ehp)/emax()*100}%"></div></div>❤️ ${Math.max(0,s.ehp)}/${emax()}</section><section class="card">${B("⚔️ ATACAR","attack()")}${B("🧪 Curar","heal()")}<p class="small">Combate automático cada 2 segundos.</p></section>`}
function attack(){s.ehp-=s.dmg+Math.floor(s.pet/2);if(s.ehp<=0){s.gold+=15+s.enemy*12+s.prestige*5;s.xp+=25+s.enemy*15;s.points++;if(Math.random()<.03){s.rarity="Legendario";s.weapon="Espada legendaria";s.dmg+=15}else if(Math.random()<.12){s.rarity="Épico";s.weapon="Espada épica";s.dmg+=9}else if(Math.random()<.3){s.rarity="Raro";s.weapon="Espada rara";s.dmg+=5}if(s.xp>=need()){s.xp-=need();s.lvl++;s.dmg+=4;s.def++;s.maxhp+=20;s.hp=s.maxhp}if(s.enemy==5)s.essence+=10;s.enemy=(s.enemy+1)%foes.length;s.ehp=emax()}save();render()}
function heal(){if(s.crops>=2){s.crops-=2;s.hp=Math.min(s.maxhp,s.hp+70);save();render()}}
function skills(a){a.innerHTML=`<section class="card"><h2>🌳 Talentos</h2><p>Puntos: ${s.points}</p>${B("💪 Fuerza +5 daño","tal('d')")}${B("🛡️ Defensa +3","tal('f')")}${B("❤️ Vida +25","tal('h')")}</section><section class="card"><h2>⛏️ Producción</h2>${B("Minería Nv."+s.mining,"g('ore','mining')")}${B("Tala Nv."+s.woodcut,"g('wood','woodcut')")}${B("Pesca Nv."+s.fishing,"g('fish','fishing')")}${B("Agricultura Nv."+s.farming,"g('crops','farming')")}</section>`}
function tal(x){if(s.points<1)return;if(x=="d")s.dmg+=5;if(x=="f")s.def+=3;if(x=="h"){s.maxhp+=25;s.hp=s.maxhp}s.points--;save();render()}function g(r,k){s[r]+=2+s[k];if(s.gold>=100){s.gold-=100;s[k]++}save();render()}
function inv(a){a.innerHTML=`<section class="card"><h2>🎒 Inventario</h2>🪵${s.wood} ⛏️${s.ore} 🐟${s.fish} 🌾${s.crops} ✨${s.essence}${B("🧪 Fabricar poción","potion")}${B("🔨 Forjar arma","forge")}<hr>⚔️ ${s.weapon} [${s.rarity}]</section>`}
function potion(){if(s.crops>=4&&s.fish>=2){s.crops-=4;s.fish-=2}save();render()}function forge(){if(s.ore>=10&&s.gold>=80){s.ore-=10;s.gold-=80;s.dmg+=10;s.weapon="Arma reforzada";s.rarity="Raro"}save();render()}
function pets(a){a.innerHTML=`<section class="card"><h2>🐺 Lobo Nv.${s.pet}</h2>Bonificación: +${Math.floor(s.pet/2)} daño${B("🍖 Entrenar — 100 oro","feed")}</section>`}function feed(){if(s.gold>=100){s.gold-=100;s.pet++;s.dmg++}save();render()}
function world(a){a.innerHTML='<section class="card"><h2>🗺️ Mundo</h2>'+["🌲 Bosque","⛏️ Minas","🌫️ Pantano","🏰 Fortaleza","🔥 Cumbre","👑 Trono"].map((z,i)=>B(z+" · nivel "+(1+i*5),`travel(${i})`)).join("")+"</section>"}function travel(i){if(s.lvl>=1+i*5){s.enemy=Math.min(i,5);s.ehp=emax()}save();render()}
function pre(a){let n=Math.floor(s.lvl/10);a.innerHTML=`<section class="card"><h2>♻️ Prestigio</h2>Disponibles: ${n}<p>Cada prestigio da +2 daño y más oro offline.</p>${B("♻️ Reiniciar","prest()")}</section>`}function prest(){let n=Math.floor(s.lvl/10);if(!n)return;s.prestige+=n;s.lvl=1;s.xp=0;s.gold=0;s.dmg=10+s.prestige*2;s.def=2;s.maxhp=120;s.hp=120;s.points=0;s.enemy=0;s.ehp=emax();save();render()}setInterval(attack,2000);render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
