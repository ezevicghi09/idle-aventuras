<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17121f"><link rel="manifest" href="manifest.json"><title>Idle Aventuras V4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100d16;color:#f7f3ff;font-family:system-ui,sans-serif}header{padding:12px;background:#20182b;position:sticky;top:0;z-index:5}.top{display:flex;justify-content:space-between;font-weight:900}.gold{color:#f4c95d}.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;font-size:12px}.stat,.card{background:#241b31;border:1px solid #ffffff12;border-radius:14px;padding:11px}.bar{height:8px;background:#ffffff15;border-radius:8px;overflow:hidden}.fill{height:100%;background:#65d49e}.hp{background:#e85b72}main{padding:12px 12px 90px;max-width:620px;margin:auto}.arena{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}.avatar{font-size:68px}.name{font-weight:800}.btn{width:100%;border:0;border-radius:11px;padding:12px;margin-top:7px;background:#68459a;color:white;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.item{background:#ffffff08;border:1px solid #ffffff12;border-radius:11px;padding:10px}nav{position:fixed;bottom:0;left:0;right:0;background:#18121f;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}nav button{border:0;background:none;color:#aaa0b8;padding:8px;font-size:11px}nav b{display:block;font-size:19px}nav .on{color:white}.muted{color:#aaa0b8;font-size:13px}.log{font-size:12px;padding:3px 0}
</style></head><body><header><div class="top"><span>⚔️ Idle Aventuras V4</span><span class="gold">🪙 <i id="gold">0</i></span></div><div id="stats" class="stats"></div></header><main id="app"></main><nav id="nav"></nav>
<script>
const E=[["🐀","Rata de cueva",60],["👺","Goblin",140],["👹","Orco",300],["🧟","Caballero oscuro",650],["🐉","Dragón joven",1400],["👑","Rey de las sombras",3500]];
const Z=["🌲 Bosque","⛏️ Minas","🌫️ Pantano","🏰 Fortaleza","🔥 Cumbre","👑 Trono"];
const D={lv:1,xp:0,g:100,atk:14,def:3,hp:140,mhp:140,crit:5,en:0,ehp:60,pts:0,pre:0,pet:1,min:1,wood:1,fish:1,farm:1,ore:0,woodr:0,fishr:0,crop:0,ess:0,weapon:"Espada de aprendiz",rar:"Común",last:Date.now(),log:[]};
let s=Object.assign({},D,JSON.parse(localStorage.getItem("iav4")||"{}")),tab="combate";
function need(){return Math.floor(100*Math.pow(s.lv,1.3))}function em(){return E[s.en][2]+s.lv*18}function save(){s.last=Date.now();localStorage.setItem("iav4",JSON.stringify(s))}
let mins=Math.min(720,Math.floor((Date.now()-s.last)/60000));if(mins>0){s.g+=mins*(4+s.lv+s.pre*3);s.log.unshift("💤 Progreso offline: +"+mins*(4+s.lv+s.pre*3)+" oro");save()}if(!s.ehp)s.ehp=em();
function add(x){s.log.unshift(x);s.log=s.log.slice(0,6);save()}
function pct(a,b){return Math.max(0,Math.min(100,a/b*100))}
function B(t,f){return `<button class="btn" onclick="${f}">${t}</button>`}
function stats(){document.querySelector("#gold").textContent=s.g.toLocaleString();document.querySelector("#stats").innerHTML=`<div class="stat">⭐ Nv.${s.lv} XP ${s.xp}/${need()}<div class="bar"><div class="fill" style="width:${pct(s.xp,need())}%"></div></div></div><div class="stat">❤️ ${s.hp}/${s.mhp}<div class="bar"><div class="fill hp" style="width:${pct(s.hp,s.mhp)}%"></div></div></div><div class="stat">⚔️${s.atk} 🛡️${s.def}</div><div class="stat">🎯${s.crit}% ♻️${s.pre}</div>`}
const tabs=[["⚔️","combate"],["🌳","habilidades"],["🎒","inventario"],["🗺️","mundo"],["🐺","mascotas"]];
function nav(){document.querySelector("#nav").innerHTML=tabs.map(x=>`<button class="${tab==x[1]?"on":""}" onclick="go('${x[1]}')"><b>${x[0]}</b>${x[1]}</button>`).join("")}
function go(x){tab=x;render()}
function render(){stats();nav();({combate,habilidades,inventario,mundo,mascotas}[tab])(document.querySelector("#app"))}
function combate(a){let e=E[s.en];a.innerHTML=`<section class="card arena"><div><div class="avatar">🧙</div><b>Aventurero</b><div class="bar"><div class="fill hp" style="width:${pct(s.hp,s.mhp)}%"></div></div>${s.hp}/${s.mhp}</div><div><div class="avatar">${e[0]}</div><b>${e[1]}</b><div class="bar"><div class="fill hp" style="width:${pct(s.ehp,em())}%"></div></div>${Math.max(0,s.ehp)}/${em()}</div></section><section class="card">${B("⚔️ ATACAR","attack()")}${B("🧪 Curar (2 cultivos)","heal()")}<p class="muted">Combate automático cada 2 segundos · crítico ${s.crit}%</p></section><section class="card"><b>📜 Registro</b>${s.log.map(x=>`<div class="log">${x}</div>`).join("")}</section>`}
function attack(){let d=s.atk+Math.floor(s.pet/2);if(Math.random()*100<s.crit)d=Math.floor(d*1.5);s.ehp-=d;if(s.ehp<=0){let r=25+s.en*20+s.lv*2+s.pre*8;s.g+=r;s.xp+=35+s.en*20;s.pts++;loot();add("⚔️ Derrotaste a "+E[s.en][1]+" · +"+r+" oro");if(s.xp>=need()){s.xp-=need();s.lv++;s.atk+=4;s.def++;s.mhp+=22;s.hp=s.mhp;add("🎉 Nivel "+s.lv)}if(s.en==5){s.ess+=10;add("👑 Jefe: +10 esencia")}s.en=(s.en+1)%E.length;s.ehp=em()}else{s.hp-=Math.max(1,E[s.en][2]/18-s.def);if(s.hp<=0){s.hp=s.mhp;s.g=Math.floor(s.g*.95);add("💀 Derrota: perdiste 5% del oro")}}save();render()}
function loot(){let r=Math.random()*100;if(r<2){s.rar="Mítico";s.weapon="Hoja del vacío";s.atk+=25;add("🌈 BOTÍN MÍTICO")}else if(r<7){s.rar="Legendario";s.weapon="Espada del dragón";s.atk+=15;add("🟨 BOTÍN LEGENDARIO")}else if(r<18){s.rar="Épico";s.weapon="Espada rúnica";s.atk+=9;add("🟪 BOTÍN ÉPICO")}else if(r<38){s.rar="Raro";s.weapon="Espada reforzada";s.atk+=5;add("🟦 BOTÍN RARO")}else s.ore++}
function heal(){if(s.crop>=2){s.crop-=2;s.hp=Math.min(s.mhp,s.hp+80)}save();render()}
function habilidades(a){let q=[["⛏️","Minería","min","ore"],["🌲","Tala","wood","woodr"],["🎣","Pesca","fish","fishr"],["🌾","Agricultura","farm","crop"]];a.innerHTML=`<section class="card"><h3>🌳 Árbol de talentos · ${s.pts} puntos</h3>${B("💪 +5 ataque","tal('a')")}${B("🛡️ +3 defensa","tal('d')")}${B("❤️ +30 vida","tal('h')")}${B("🎯 +2% crítico","tal('c')")}</section><section class="card"><h3>📈 Habilidades</h3><div class="grid">${q.map(x=>`<div class="item">${x[0]} ${x[1]}<br>Nivel ${s[x[2]]}${B("Entrenar","gather('"+x[2]+"','"+x[3]+"')")}</div>`).join("")}</div></section>`}
function tal(x){if(!s.pts)return;if(x=="a")s.atk+=5;if(x=="d")s.def+=3;if(x=="h"){s.mhp+=30;s.hp=s.mhp}if(x=="c")s.crit+=2;s.pts--;save();render()}
function gather(k,r){s[r]+=2+s[k];if(s.g>=100){s.g-=100;s[k]++;add("📈 "+k+" subió a "+s[k])}save();render()}
function inventario(a){a.innerHTML=`<section class="card"><h3>🎒 Recursos</h3><div class="grid"><div class="item">⛏️ ${s.ore}</div><div class="item">🪵 ${s.woodr}</div><div class="item">🐟 ${s.fishr}</div><div class="item">🌾 ${s.crop}</div><div class="item">✨ ${s.ess}</div></div></section><section class="card"><h3>⚔️ Equipo</h3><p>${s.weapon} · <b>${s.rar}</b><br>🛡️ Armadura de cuero</p>${B("🔨 Forjar +10 ataque · 10 mineral + 80 oro","forge")}</section>`}
function forge(){if(s.ore>=10&&s.g>=80){s.ore-=10;s.g-=80;s.atk+=10;s.rar="Raro";s.weapon="Arma forjada";add("🔨 Arma mejorada")}save();render()}
function mundo(a){a.innerHTML=`<section class="card"><h3>🗺️ Mundos</h3>${Z.map((z,i)=>`<div class="item" style="margin:7px 0">${z}<br><span class="muted">Nivel ${1+i*5}</span>${B("Viajar","travel("+i+")")}</div>`).join("")}</section>`}
function travel(i){if(s.lv>=1+i*5){s.en=i;s.ehp=em();add("🗺️ Viajaste a "+Z[i])}else add("🔒 Necesitás nivel "+(1+i*5));save();render()}
function mascotas(a){a.innerHTML=`<section class="card" style="text-align:center"><div style="font-size:80px">🐺</div><h3>Lobo guardián · Nivel ${s.pet}</h3><p>+${Math.floor(s.pet/2)} ataque</p>${B("🍖 Entrenar · 100 oro","pet()")}</section><section class="card"><h3>🔒 Próximamente</h3>🐦 Cuervo · 🦊 Zorro · 🐲 Dragón · 🗿 Golem</section>`}
function pet(){if(s.g>=100){s.g-=100;s.pet++;add("🐺 Lobo nivel "+s.pet)}save();render()}
setInterval(()=>attack(),2000);render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
